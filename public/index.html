<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Default SEO -->

    <meta
      name="description"
      content="Secuzy Security Pvt Ltd provides professional security services including manned guarding, corporate security, event security, and VIP protection."
    />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.secuzysecurity.com/" />

    <!-- Open Graph (WhatsApp, LinkedIn) -->
    <meta property="og:title" content="Secuzy Security Services" />

    <meta property="og:type" content="website" />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#0f172a", // dark blue-gray like securitas
              accent: "#dc2626",  // red accent

          },
        },

  <body class="bg-gray-100">
